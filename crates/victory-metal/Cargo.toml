[package]
name = "victory-metal"
description = "Prototype native Metal backend: zero-copy title memory, compute dispatch, submission latency probe (macOS only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
victory-backend.workspace = true
tracing.workspace = true

# Everything is macOS-only; on other targets the crate builds as an empty binary.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
block2 = "0.6"
libc = "0.2"
objc2-quartz-core = "0.3"

[lints]
workspace = true
